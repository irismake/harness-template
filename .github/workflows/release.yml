# 자동 릴리스 — main 에 머지된 커밋의 Template CI(Test)가 통과하면 실행된다.
#
#   지난 릴리스 이후 main 커밋(Squash 커밋 = PR 제목)을 Conventional Commit 으로 분석 (scripts/release.py)
#     feat → minor / fix · perf · refactor · ci · build · revert → patch / docs · chore · test · style 만 → 릴리스 없음
#   → release 브랜치에 릴리스 커밋(main 코드 + VERSION + CHANGELOG) · 태그 vX.Y.Z → release 이동
#   → 각 프로젝트 Dependabot 이 release 브랜치의 새 태그를 보고 업데이트 PR 을 연다
#
# main 은 보호 브랜치라 쓰지 않는다 (release 브랜치 · 태그만 쓴다 → Secret 불필요).
# Template CI 가 실패한 커밋은 릴리스되지 않는다. 수동 실행(workflow_dispatch)은 Template CI 를 다시 돌린 뒤 릴리스한다.
name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "버전 올리기 (auto = 커밋 분석)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Template CI (수동 실행 때만)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml

  release:
    name: 릴리스
    needs: test
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success') ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: 릴리스 (필요할 때만)
        env:
          MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --main "$MAIN_SHA" --bump "$BUMP"
