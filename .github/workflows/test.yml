# Template CI — "하네스 자체가 정상인가?"
# PR · main push 마다 돈다. main push 의 결과가 성공이어야 자동 릴리스(release.yml)가 실행된다.
#   unit     회귀 테스트: init · 재실행 · 구성 검사 · sync · Secret · 로그 · 계층 · git 훅 · Claude 훅 · 차단 패턴 ·
#            서브모듈 수정 감지 · release 브랜치 추적 · 이전 릴리스 → 지금 업그레이드 호환성
#   flutter  실제 Flutter 앱 fixture: init → flutter create → verify 통과 → 계층 · print · 포맷 · 분석 위반 검출 → harness test
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Harness template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 업그레이드 호환성 테스트가 이전 릴리스 태그를 쓴다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PR 제목 형식 (Squash 커밋 제목 = 자동 릴리스 판단 기준)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|refactor|ci|build|revert|docs|chore|test|style)(\([^)]+\))?!?: .+'; then
            echo "::error::PR 제목은 '<type>: <요약>' 이어야 한다 — feat(minor) · fix|perf|refactor|ci|build|revert(patch) · docs|chore|test|style(릴리스 없음), 깨지는 변경은 type 뒤 !"
            exit 1
          fi
      - name: 문법
        run: python -m py_compile scripts/*.py scripts/hooks/*.py packs/*/checks.py githooks/commit-msg
      - name: 회귀 테스트
        run: python -m unittest discover -s tests -v

  flutter:
    name: Flutter pack fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter 앱에 설치 · 검사
        run: bash tests/flutter_fixture.sh
