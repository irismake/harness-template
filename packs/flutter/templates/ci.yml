# 하네스 Flutter 팩 CI (harness init 이 .github/workflows/ci.yml 로 복사했다 — 프로젝트에 맞게 고쳐도 된다)
#
#   Harness  하네스 구성 검사 + PR 변경분 코드 규칙 검사 (로컬 훅 · git 훅과 같은 검사, 우회했어도 여기서 걸린다)
#   Flutter  dart format · flutter analyze · flutter test (앱이 생긴 뒤부터 — pubspec.yaml 이 없으면 건너뜀)
#
# 브랜치 보호에서 두 job 을 Required status check 로 지정하면 위반이 있는 PR 은 머지할 수 없다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: 하네스 구성 검사
        run: python3 .harness/core/scripts/check_rules.py
      - name: 하네스 코드 규칙 검사 (PR 변경분)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .harness/core/scripts/check_code.py --base "origin/$BASE_REF"

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 앱 존재 확인
        id: app
        run: |
          if [ -f pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "pubspec.yaml 이 없어 건너뜀 (설계 · 골격 생성 전)"; fi
      - name: Flutter 버전 (.fvmrc 가 있으면 그 버전)
        id: version
        if: steps.app.outputs.exists == 'true'
        run: |
          if [ -f .fvmrc ]; then echo "flutter=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.exists == 'true'
        with:
          channel: stable
          flutter-version: ${{ steps.version.outputs.flutter }}
          cache: true
      - name: 패키지
        if: steps.app.outputs.exists == 'true'
        run: flutter pub get
      - name: 코드 생성 (build_runner 를 쓰면)
        if: steps.app.outputs.exists == 'true'
        run: |
          if grep -qE '^\s+build_runner:' pubspec.yaml; then dart run build_runner build --delete-conflicting-outputs; fi
      - name: 포맷
        if: steps.app.outputs.exists == 'true'
        run: |
          files=$(git ls-files '*.dart' | grep -vE '\.(g|freezed|gr|config|mocks|chopper)\.dart$' || true)
          if [ -n "$files" ]; then dart format --output=none --set-exit-if-changed $files; fi
      - name: 정적 분석
        if: steps.app.outputs.exists == 'true'
        run: flutter analyze
      - name: 테스트
        if: steps.app.outputs.exists == 'true'
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then flutter test; else echo "테스트 없음"; fi
